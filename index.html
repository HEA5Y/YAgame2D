<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brainrot Factory Evolution</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Idle игра про производство мемных мозгов">
</head>
<body>
    <!-- Загрузочный экран -->
    <div id="loading-screen">
        <div class="loading-content">
            <h1 class="logo">🧠 Brainrot Factory</h1>
            <div class="loader"></div>
            <p id="loading-text">Загрузка ресурсов...</p>
            <div id="loading-progress" class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Основной контейнер игры -->
    <div id="game-container" style="display: none;">
        <!-- Canvas для рендеринга мира -->
        <canvas id="game-canvas"></canvas>
        
        <!-- UI Слой -->
        <div id="ui-layer">
            <!-- Верхняя панель (HUD) -->
            <div class="hud-top">
                <div class="resource-panel">
                    <div class="resource-item">
                        <span class="icon">🪙</span>
                        <span id="ui-coins" class="value">0</span>
                    </div>
                    <div class="resource-item">
                        <span class="icon">🧠</span>
                        <span id="ui-braincells" class="value">0</span>
                    </div>
                </div>
                <div class="settings-btn" id="btn-settings">⚙️</div>
            </div>

            <!-- Нижняя панель навигации -->
            <div class="nav-bottom">
                <button class="nav-btn active" data-tab="factory">🏭</button>
                <button class="nav-btn" data-tab="upgrades">⚡</button>
                <button class="nav-btn" data-tab="collection">📒</button>
                <button class="nav-btn" data-tab="quest">📜</button>
            </div>

            <!-- Всплывающие уведомления -->
            <div id="notifications-area"></div>
            
            <!-- Модальные окна (скрыты по умолчанию) -->
            <div id="modal-overlay" class="hidden"></div>
        </div>
    </div>

    <!-- СКРИПТЫ (СТРОГИЙ ПОРЯДОК!) -->
    
    <!-- 1. Утилиты и Ядро -->
    <script src="src/utils/Logger.js"></script>
    <script src="src/utils/MathUtils.js"></script>
    <script src="src/core/EventBus.js"></script>
    <script src="src/core/GameConfig.js"></script>
    <script src="src/core/ErrorGuard.js"></script>
    <script src="src/core/CanvasManager.js"></script>
    <script src="src/core/SaveVersionManager.js"></script>
    <script src="src/core/ManagerRegistry.js"></script>

    <!-- 2. Данные (ОБЯЗАТЕЛЬНО ДО МЕНЕДЖЕРОВ) -->
    <script src="src/data/EconomyData.js"></script>
    <script src="src/data/UpgradeData.js"></script>
    <script src="src/data/AchievementData.js"></script>
    <script src="src/data/QuestData.js"></script>
    <script src="src/data/EventData.js"></script>
    <script src="src/data/CollectionData.js"></script> <!-- Если есть -->

    <!-- 3. Сущности -->
    <script src="src/entities/FloatingText.js"></script>
    <script src="src/entities/FactoryLine.js"></script>
    <script src="src/entities/Worker.js"></script>
    <script src="src/entities/Particle.js"></script> <!-- Если есть -->

    <!-- 4. Менеджеры (Базовые) -->
    <script src="src/managers/AssetManager.js"></script>
    <script src="src/managers/TimeManager.js"></script>
    <script src="src/managers/AudioManager.js"></script>
    <script src="src/managers/ObjectPoolManager.js"></script>
    <script src="src/managers/TweenManager.js"></script>
    <script src="src/managers/ParticleManager.js"></script>
    <script src="src/managers/JuiceManager.js"></script>

    <!-- 5. Менеджеры (Логика) -->
    <script src="src/managers/EconomyManager.js"></script>
    <script src="src/managers/ResourceManager.js"></script>
    <script src="src/managers/SaveManager.js"></script>
    
    <!-- 6. Менеджеры (Зависимые от базовых) -->
    <script src="src/managers/FactoryManager.js"></script>
    <script src="src/managers/UpgradeManager.js"></script>
    <script src="src/managers/AchievementManager.js"></script>
    <script src="src/managers/QuestManager.js"></script>
    <script src="src/managers/EventManager.js"></script>
    <script src="src/managers/CollectionManager.js"></script>
    <script src="src/managers/ChestManager.js"></script>
    <script src="src/managers/BattlePassManager.js"></script>
    <script src="src/managers/DailyRewardsManager.js"></script>
    <script src="src/managers/PrestigeManager.js"></script>
    <script src="src/managers/OfflineManager.js"></script>
    <script src="src/managers/SceneManager.js"></script>
    <script src="src/managers/UIManager.js"></script>
    <script src="src/managers/YandexSDKManager.js"></script>

    <!-- 7. Системные классы -->
    <script src="src/core/ManagersInitializer.js"></script>
    <script src="src/core/Engine.js"></script>
    <script src="src/core/Game.js"></script>
    
    <!-- 8. Точка входа -->
    <script src="src/main.js"></script>
</body>
</html>
