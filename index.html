<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Brainrot Factory Evolution</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=3">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Idle игра про производство мемных мозгов">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-content">
            <h1 class="logo">Brainrot Factory</h1>
            <div class="loader"></div>
            <p id="loading-text">Загрузка ресурсов...</p>
            <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
    </div>

    <div id="game-app" style="display:none">
        <header id="top-bar">
            <div class="resource-panel">
                <div class="resource-item"><span class="icon">🪙</span><span id="ui-coins" class="value">0</span></div>
                <div class="resource-item"><span class="icon">🧠</span><span id="ui-braincells" class="value">0</span></div>
                <div class="resource-item"><span class="icon">💎</span><span id="ui-gems" class="value">0</span></div>
            </div>
            <button id="btn-settings" class="settings-btn">⚙️</button>
        </header>

        <main id="game-viewport">
            <canvas id="game-canvas"></canvas>
            <div id="ui-layer">
                <div id="popup-layer"></div>
                <div id="notification-container"></div>
            </div>
        </main>

        <nav id="bottom-bar">
            <button class="nav-btn active" data-tab="factory">🏭<span>Завод</span></button>
            <button class="nav-btn" data-tab="upgrades">⚡<span>Прокачка</span></button>
            <button class="nav-btn" data-tab="collection">📒<span>Коллекция</span></button>
            <button class="nav-btn" data-tab="quest">📜<span>Квесты</span></button>
        </nav>
    </div>

    <aside id="side-panel" class="collapsed">
        <div class="side-panel-inner">
            <div class="side-panel-header">
                <span class="side-panel-title">Меню</span>
                <button class="side-panel-close">✕</button>
            </div>
            <div id="panel-factory" class="side-panel-panel" style="display:none">
                <h2>🏭 Производственные линии</h2>
                <div id="content-factory"></div>
            </div>
            <div id="panel-upgrades" class="side-panel-panel" style="display:none">
                <h2>⚡ Прокачка</h2>
                <div id="content-upgrades"></div>
            </div>
            <div id="panel-collection" class="side-panel-panel" style="display:none">
                <h2>📒 Коллекция</h2>
                <div id="content-collection"></div>
            </div>
            <div id="panel-quest" class="side-panel-panel" style="display:none">
                <h2>📜 Квесты</h2>
                <div id="content-quest"></div>
            </div>
        </div>
        <div class="side-panel-handle">☰</div>
    </aside>

    <script src="Logger.js"></script>
    <script src="MathUtils.js"></script>
    <script src="BigNumber.js"></script>
    <script src="GameConfig.js"></script>
    <script src="EventBus.js"></script>
    <script src="ErrorGuard.js"></script>
    <script src="CanvasManager.js"></script>
    <script src="SaveVersionManager.js"></script>
    <script src="ManagerRegistry.js"></script>
    <script src="EconomyData.js"></script>
    <script src="UpgradeData.js"></script>
    <script src="AchievementData.js"></script>
    <script src="QuestData.js"></script>
    <script src="EventData.js"></script>
    <script src="FloatingText.js"></script>
    <script src="FactoryLine.js"></script>
    <script src="Worker.js"></script>
    <script src="AssetManager.js"></script>
    <script src="TimeManager.js"></script>
    <script src="AudioManager.js"></script>
    <script src="ObjectPoolManager.js"></script>
    <script src="TweenManager.js"></script>
    <script src="ParticleManager.js"></script>
    <script src="JuiceManager.js"></script>
    <script src="EconomyManager.js"></script>
    <script src="ResourceManager.js"></script>
    <script src="SaveManager.js"></script>
    <script src="FactoryManager.js"></script>
    <script src="UpgradeManager.js"></script>
    <script src="AchievementManager.js"></script>
    <script src="QuestManager.js"></script>
    <script src="EventManager.js"></script>
    <script src="CollectionManager.js"></script>
    <script src="ChestManager.js"></script>
    <script src="BattlePassManager.js"></script>
    <script src="DailyRewardsManager.js"></script>
    <script src="PrestigeManager.js"></script>
    <script src="OfflineManager.js"></script>
    <script src="SceneManager.js"></script>
    <script src="UIManager.js"></script>
    <script src="YandexSDKManager.js"></script>
    <script src="ManagersInitializer.js"></script>
    <script src="Engine.js"></script>
    <script src="Game.js"></script>
    <script src="main.js"></script>
</body>
</html>
